<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDeal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
        }

        .search-box button {
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #2874f0;
            font-weight: bold;
            cursor: pointer;
        }

        nav {
            margin-left: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-count {
            background: #ff6161;
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 12px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .products {
            padding: 40px 20px;
            text-align: center;
        }

        .products h2 {
            font-size: 30px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #2874f0;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #174ea6;
        }

        .sort-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0 30px;
        }

        .sort-box select {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product-card h3 {
            margin: 15px 0 8px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #2874f0;
        }

        .rating {
            color: #f39c12;
            margin: 8px 0;
        }

        .marketplace {
            color: #666;
            margin-bottom: 15px;
        }

        .buy-btn,
        .cart-btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .buy-btn {
            background: #2874f0;
            color: white;
        }

        .cart-btn {
            background: #ff9f00;
            color: white;
            margin-left: 5px;
        }

        #loading {
            color: #666;
        }

        #error {
            color: red;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.55);
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #555;
        }

        .modal h2 {
            margin-top: 5px;
        }

        /* CART */

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .cart-item-info {
            flex: 1;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-box button {
            width: 30px;
            height: 30px;
            border: none;
            background: #2874f0;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .remove-btn {
            border: none;
            background: #ff6161;
            color: white;
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cart-total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: #fb641b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .clear-btn {
            background: #777;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* CHECKOUT FORM */

        .checkout-form {
            display: none;
        }

        .checkout-form input,
        .checkout-form textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial;
        }

        .checkout-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .place-order-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: #2874f0;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* ORDER HISTORY */

        .order-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .order-card h3 {
            margin-top: 0;
            color: #2874f0;
        }

        .order-status {
            color: #168a16;
            font-weight: bold;
        }

        .success {
            text-align: center;
            padding: 20px;
        }

        .success-icon {
            font-size: 55px;
        }

        @media (max-width: 700px) {
            header {
                padding: 15px;
            }

            nav {
                width: 100%;
                text-align: center;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">SmartDeal</div>

    <div class="search-box">
        <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                onkeyup="searchProducts()"
        >

        <button onclick="searchProducts()">
            Search
        </button>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="#products">Products</a>

        <a href="#" onclick="openOrders(event)">
            My Orders
        </a>

        <a href="#" onclick="openCart(event)">
            🛒 Cart
            <span id="cartCount" class="cart-count">0</span>
        </a>
    </nav>

</header>


<section class="hero">

    <h1>Welcome to SmartDeal 🛍️</h1>

    <p>Best Deals. Best Products. Best Prices.</p>

    <a href="#products" class="btn">
        Shop Now
    </a>

</section>


<section class="products" id="products">

    <h2>Featured Products</h2>

    <div class="filters">

        <button
                class="filter-btn active"
                onclick="filterProducts('all', this)">
            All
        </button>

        <button
                class="filter-btn"
                onclick="filterProducts('Mobiles', this)">
            Mobiles
        </button>

        <button
                class="filter-btn"
                onclick="filterProducts('Headphones', this)">
            Headphones
        </button>

    </div>


    <div class="sort-box">

        <label for="sortSelect">
            Sort by:
        </label>

        <select id="sortSelect" onchange="applyFilters()">

            <option value="default">
                Default
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

        </select>

    </div>


    <p id="loading">
        Loading products...
    </p>

    <p id="error"></p>

    <div
            class="product-grid"
            id="productGrid">
    </div>

</section>


<!-- CART MODAL -->

<div id="cartModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeCart()">
            &times;
        </span>

        <h2>🛒 Shopping Cart</h2>

        <div id="cartItems"></div>

        <div
                id="cartEmpty"
                style="text-align:center; color:#777;">
            Your cart is empty.
        </div>

        <div
                id="cartTotal"
                class="cart-total">
        </div>

        <button
                id="clearCartBtn"
                class="clear-btn"
                onclick="clearCart()">
            Clear Cart
        </button>

        <button
                id="checkoutBtn"
                class="checkout-btn"
                onclick="showCheckout()">
            Proceed to Checkout
        </button>

    </div>

</div>


<!-- CHECKOUT MODAL -->

<div id="checkoutModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeCheckout()">
            &times;
        </span>

        <h2>🧾 Checkout</h2>

        <div id="checkoutSummary"></div>

        <div class="checkout-form" id="checkoutForm">

            <label>Full Name</label>

            <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
            >


            <label>Mobile Number</label>

            <input
                    type="tel"
                    id="customerPhone"
                    placeholder="Enter mobile number"
            >


            <label>Delivery Address</label>

            <textarea
                    id="customerAddress"
                    placeholder="Enter complete delivery address">
            </textarea>


            <button
                    class="place-order-btn"
                    onclick="placeOrder()">
                Place Order
            </button>

        </div>

    </div>

</div>


<!-- ORDERS MODAL -->

<div id="ordersModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeOrders()">
            &times;
        </span>

        <h2>📦 My Orders</h2>

        <div id="ordersList"></div>

    </div>

</div>


<script>

    let allProducts = [];

    let selectedCategory = "all";

    let cart = JSON.parse(
        localStorage.getItem("smartdealCart") || "[]"
    );

    let orders = JSON.parse(
        localStorage.getItem("smartdealOrders") || "[]"
    );


    /* =========================
       SEARCH
    ========================= */

    function searchProducts() {
        applyFilters();
    }


    /* =========================
       CATEGORY
    ========================= */

    function filterProducts(category, button) {

        selectedCategory = category;

        document
            .querySelectorAll(".filter-btn")
            .forEach(btn => {
                btn.classList.remove("active");
            });

        if (button) {
            button.classList.add("active");
        }

        applyFilters();
    }


    /* =========================
       FILTER + SORT
    ========================= */

    function applyFilters() {

        const searchText =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

        const sortValue =
            document.getElementById("sortSelect").value;


        let filteredProducts =
            allProducts.filter(product => {

                const name =
                    String(product.name || "")
                        .toLowerCase();

                const category =
                    String(product.category || "");


                const matchesSearch =
                    name.includes(searchText);

                const matchesCategory =
                    selectedCategory === "all" ||
                    category === selectedCategory;


                return (
                    matchesSearch &&
                    matchesCategory
                );
            });


        if (sortValue === "low") {

            filteredProducts.sort(
                (a, b) =>
                    Number(a.price) - Number(b.price)
            );

        } else if (sortValue === "high") {

            filteredProducts.sort(
                (a, b) =>
                    Number(b.price) - Number(a.price)
            );

        }


        renderProducts(filteredProducts);
    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts(products) {

        const productGrid =
            document.getElementById("productGrid");

        productGrid.innerHTML = "";


        if (!products.length) {

            productGrid.innerHTML =
                "<p>No products found.</p>";

            return;
        }


        products.forEach(product => {

            const card =
                document.createElement("div");

            card.className = "product-card";


            card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <h3>
                    ${product.name}
                </h3>

                <div class="price">
                    ₹${Number(product.price)
                .toLocaleString("en-IN")}
                </div>

                <div class="rating">
                    ⭐ ${product.rating}
                </div>

                <div class="marketplace">
                    Available on ${product.marketplace}
                </div>

                <a
                    class="buy-btn"
                    href="${product.productUrl}"
                    target="_blank">
                    Buy Now
                </a>

                <button
                    class="cart-btn"
                    onclick="addToCart(${product.id})">
                    🛒 Add to Cart
                </button>
            `;


            productGrid.appendChild(card);

        });
    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    fetch("/api/products")

        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Failed to load products"
                );
            }

            return response.json();

        })

        .then(products => {

            allProducts = products;

            document
                .getElementById("loading")
                .style.display = "none";

            applyFilters();

        })

        .catch(error => {

            document
                .getElementById("loading")
                .style.display = "none";

            document
                .getElementById("error")
                .textContent =
                "Products load nahi ho paaye.";

            console.error(error);

        });


    /* =========================
       CART
    ========================= */

    function saveCart() {

        localStorage.setItem(
            "smartdealCart",
            JSON.stringify(cart)
        );

        updateCartCount();
    }


    function addToCart(productId) {

        const product =
            allProducts.find(
                p => Number(p.id) === Number(productId)
            );


        if (!product) {
            alert("Product nahi mila.");
            return;
        }


        const existing =
            cart.find(
                item =>
                    Number(item.id) === Number(productId)
            );


        if (existing) {

            existing.quantity += 1;

        } else {

            cart.push({
                ...product,
                quantity: 1
            });

        }


        saveCart();

        alert(
            product.name +
            " cart me add ho gaya!"
        );
    }


    function updateCartCount() {

        const count =
            cart.reduce(
                (total, item) =>
                    total + Number(item.quantity),
                0
            );

        document.getElementById(
            "cartCount"
        ).textContent = count;
    }


    function openCart(event) {

        if (event) {
            event.preventDefault();
        }

        renderCart();

        document.getElementById(
            "cartModal"
        ).style.display = "block";
    }


    function closeCart() {

        document.getElementById(
            "cartModal"
        ).style.display = "none";
    }


    function renderCart() {

        const container =
            document.getElementById("cartItems");

        const empty =
            document.getElementById("cartEmpty");

        const totalElement =
            document.getElementById("cartTotal");

        const checkoutBtn =
            document.getElementById("checkoutBtn");

        const clearBtn =
            document.getElementById("clearCartBtn");


        container.innerHTML = "";


        if (!cart.length) {

            empty.style.display = "block";

            totalElement.textContent = "";

            checkoutBtn.style.display = "none";

            clearBtn.style.display = "none";

            return;
        }


        empty.style.display = "none";

        checkoutBtn.style.display = "block";

        clearBtn.style.display = "inline-block";


        let total = 0;


        cart.forEach(item => {

            const itemTotal =
                Number(item.price) *
                Number(item.quantity);

            total += itemTotal;


            const div =
                document.createElement("div");

            div.className = "cart-item";


            div.innerHTML = `

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="cart-item-info">

                    <strong>
                        ${item.name}
                    </strong>

                    <div>
                        ₹${Number(item.price)
                .toLocaleString("en-IN")}
                    </div>

                </div>

                <div class="quantity-box">

                    <button
                        onclick="changeQuantity(${item.id}, -1)">
                        -
                    </button>

                    <strong>
                        ${item.quantity}
                    </strong>

                    <button
                        onclick="changeQuantity(${item.id}, 1)">
                        +
                    </button>

                </div>

                <button
                    class="remove-btn"
                    onclick="removeFromCart(${item.id})">
                    Remove
                </button>

            `;


            container.appendChild(div);

        });


        totalElement.textContent =
            "Total: ₹" +
            total.toLocaleString("en-IN");
    }


    function changeQuantity(productId, change) {

        const item =
            cart.find(
                p =>
                    Number(p.id) === Number(productId)
            );


        if (!item) {
            return;
        }


        item.quantity += change;


        if (item.quantity <= 0) {

            cart =
                cart.filter(
                    p =>
                        Number(p.id) !==
                        Number(productId)
                );
        }


        saveCart();

        renderCart();
    }


    function removeFromCart(productId) {

        cart =
            cart.filter(
                item =>
                    Number(item.id) !==
                    Number(productId)
            );

        saveCart();

        renderCart();
    }


    function clearCart() {

        if (!cart.length) {
            return;
        }


        if (
            confirm(
                "Kya aap cart clear karna chahte hain?"
            )
        ) {

            cart = [];

            saveCart();

            renderCart();
        }
    }


    /* =========================
       CHECKOUT
    ========================= */

    function showCheckout() {

        if (!cart.length) {

            alert(
                "Checkout ke liye cart me product add karein."
            );

            return;
        }


        closeCart();


        const summary =
            document.getElementById(
                "checkoutSummary"
            );


        let total = 0;

        let html = "<h3>Order Summary</h3>";


        cart.forEach(item => {

            const itemTotal =
                Number(item.price) *
                Number(item.quantity);

            total += itemTotal;


            html += `
                <p>
                    ${item.name}
                    × ${item.quantity}
                    —
                    ₹${itemTotal.toLocaleString("en-IN")}
                </p>
            `;

        });


        html += `
            <hr>
            <h3>
                Total:
                ₹${total.toLocaleString("en-IN")}
            </h3>
        `;


        summary.innerHTML = html;


        document.getElementById(
            "checkoutModal"
        ).style.display = "block";

        document.getElementById(
            "checkoutForm"
        ).style.display = "block";
    }


    function closeCheckout() {

        document.getElementById(
            "checkoutModal"
        ).style.display = "none";
    }


    /* =========================
       PLACE ORDER
    ========================= */

    function placeOrder() {

        const name =
            document.getElementById(
                "customerName"
            ).value.trim();

        const phone =
            document.getElementById(
                "customerPhone"
            ).value.trim();

        const address =
            document.getElementById(
                "customerAddress"
            ).value.trim();


        if (!name || !phone || !address) {

            alert(
                "Please name, mobile number aur address fill karein."
            );

            return;
        }


        if (!cart.length) {

            alert("Cart empty hai.");

            closeCheckout();

            return;
        }


        let total = 0;


        cart.forEach(item => {

            total +=
                Number(item.price) *
                Number(item.quantity);

        });


        const orderId =
            "SD" +
            Date.now().toString().slice(-8);


        const order = {

            id: orderId,

            date:
                new Date().toLocaleString("en-IN"),

            customer: {
                name: name,
                phone: phone,
                address: address
            },

            items: cart.map(item => ({
                id: item.id,
                name: item.name,
                price: item.price,
                quantity: item.quantity
            })),

            total: total,

            status: "Order Placed"

        };


        orders.unshift(order);


        localStorage.setItem(
            "smartdealOrders",
            JSON.stringify(orders)
        );


        cart = [];

        saveCart();


        document.getElementById(
            "checkoutModal"
        ).style.display = "none";


        document.getElementById(
            "customerName"
        ).value = "";

        document.getElementById(
            "customerPhone"
        ).value = "";

        document.getElementById(
            "customerAddress"
        ).value = "";


        alert(
            "🎉 Order successfully placed!\n\n" +
            "Order ID: " +
            orderId
        );


        openOrders();
    }


    /* =========================
       ORDER HISTORY
    ========================= */

    function openOrders(event) {

        if (event) {
            event.preventDefault();
        }

        renderOrders();

        document.getElementById(
            "ordersModal"
        ).style.display = "block";
    }


    function closeOrders() {

        document.getElementById(
            "ordersModal"
        ).style.display = "none";
    }


    function renderOrders() {

        const container =
            document.getElementById(
                "ordersList"
            );


        container.innerHTML = "";


        if (!orders.length) {

            container.innerHTML =
                "<p>No orders yet.</p>";

            return;
        }


        orders.forEach(order => {

            const div =
                document.createElement("div");

            div.className = "order-card";


            let itemsHTML = "";


            order.items.forEach(item => {

                itemsHTML += `
                    <li>
                        ${item.name}
                        × ${item.quantity}
                    </li>
                `;

            });


            div.innerHTML = `

                <h3>
                    Order #${order.id}
                </h3>

                <p>
                    <strong>Date:</strong>
                    ${order.date}
                </p>

                <p>
                    <strong>Customer:</strong>
                    ${order.customer.name}
                </p>

                <p>
                    <strong>Items:</strong>
                </p>

                <ul>
                    ${itemsHTML}
                </ul>

                <p>
                    <strong>Total:</strong>
                    ₹${Number(order.total)
                .toLocaleString("en-IN")}
                </p>

                <p class="order-status">
                    ✓ ${order.status}
                </p>

            `;


            container.appendChild(div);

        });
    }


    /* =========================
       MODAL OUTSIDE CLICK
    ========================= */

    window.onclick = function(event) {

        const cartModal =
            document.getElementById("cartModal");

        const checkoutModal =
            document.getElementById("checkoutModal");

        const ordersModal =
            document.getElementById("ordersModal");


        if (event.target === cartModal) {
            closeCart();
        }

        if (event.target === checkoutModal) {
            closeCheckout();
        }

        if (event.target === ordersModal) {
            closeOrders();
        }

    };


    /* =========================
       INITIAL CART COUNT
    ========================= */

    updateCartCount();

</script>

</body>
