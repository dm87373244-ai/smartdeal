<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDeal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 10px;
            width: 250px;
            border: none;
            border-radius: 5px;
        }

        .search-box button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #2874f0;
            font-weight: bold;
            cursor: pointer;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .products {
            padding: 40px;
            text-align: center;
        }

        .products h2 {
            font-size: 30px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #2874f0;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-btn:hover {
            opacity: 0.9;
        }

        /* Price Sorting */

        .sort-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0 30px;
        }

        .sort-box label {
            font-weight: bold;
        }

        .sort-box select {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product-card h3 {
            margin: 15px 0 8px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #2874f0;
        }

        .rating {
            color: #f39c12;
            margin: 8px 0;
        }

        .marketplace {
            color: #666;
            margin-bottom: 15px;
        }

        .buy-btn {
            display: inline-block;
            padding: 10px 18px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        #loading {
            color: #666;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">SmartDeal</div>

    <div class="search-box">
        <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
        >

        <button onclick="searchProducts()">
            Search
        </button>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="#products">Products</a>
        <a href="#">Login</a>
        <a href="#">Cart</a>
    </nav>

</header>


<section class="hero">

    <h1>Welcome to SmartDeal 🛍️</h1>

    <p>Best Deals. Best Products. Best Prices.</p>

    <a href="#products" class="btn">
        Shop Now
    </a>

</section>


<section class="products" id="products">

    <h2>Featured Products</h2>


    <!-- Category Filters -->

    <div class="filters">

        <button
                class="filter-btn"
                onclick="filterProducts('all')">
            All
        </button>

        <button
                class="filter-btn"
                onclick="filterProducts('Mobiles')">
            Mobiles
        </button>

        <button
                class="filter-btn"
                onclick="filterProducts('Headphones')">
            Headphones
        </button>

    </div>


    <!-- Price Sorting -->

    <div class="sort-box">

        <label for="sortSelect">
            Sort by:
        </label>

        <select
                id="sortSelect"
                onchange="sortProducts()">

            <option value="default">
                Default
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

        </select>

    </div>


    <p id="loading">
        Loading products...
    </p>

    <p id="error"></p>


    <div
            class="product-grid"
            id="productGrid">
    </div>

</section>


<script>

    let allProducts = [];

    let selectedCategory = "all";


    // Search Products

    function searchProducts() {

        applyFilters();

    }


    // Category Filter

    function filterProducts(category) {

        selectedCategory = category;

        applyFilters();

    }


    // Price Sorting

    function sortProducts() {

        const sortValue =
            document
                .getElementById("sortSelect")
                .value;


        if (sortValue === "low") {

            allProducts.sort(
                (a, b) => a.price - b.price
            );

        }

        else if (sortValue === "high") {

            allProducts.sort(
                (a, b) => b.price - a.price
            );

        }


        renderProducts();

    }


    // Apply Search + Category

    function applyFilters() {

        const searchText =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        const filteredProducts =
            allProducts.filter(product => {

                const matchesSearch =
                    product.name
                        .toLowerCase()
                        .includes(searchText);


                const matchesCategory =
                    selectedCategory === "all" ||
                    product.category === selectedCategory;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            });


        renderProducts(filteredProducts);

    }


    // Render Products

    function renderProducts(productsToRender = allProducts) {

        const productGrid =
            document.getElementById("productGrid");


        productGrid.innerHTML = "";


        productsToRender.forEach(product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            card.dataset.category =
                product.category;


            card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <h3>
                    ${product.name}
                </h3>

                <div class="price">
                    ₹${Number(product.price).toLocaleString("en-IN")}
                </div>

                <div class="rating">
                    ⭐ ${product.rating}
                </div>

                <div class="marketplace">
                    Available on ${product.marketplace}
                </div>

                <a
                    class="buy-btn"
                    href="${product.productUrl}"
                    target="_blank">
                    Buy Now
                </a>

            `;


            productGrid.appendChild(card);

        });

    }


    // Load Products

    fetch("/api/products")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load products"
                );

            }

            return response.json();

        })

        .then(products => {

            allProducts = products;


            document
                .getElementById("loading")
                .style.display = "none";


            renderProducts();

        })

        .catch(error => {

            document
                .getElementById("loading")
                .style.display = "none";


            document
                .getElementById("error")
                .textContent =
                "Products load nahi ho paaye.";


            console.error(error);

        });

</script>

</body>
</html>
