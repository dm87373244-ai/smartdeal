<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDeal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 10px;
            width: 250px;
            border: none;
            border-radius: 5px;
        }

        .search-box button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #2874f0;
            font-weight: bold;
            cursor: pointer;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .products {
            padding: 40px;
            text-align: center;
        }

        .products h2 {
            font-size: 30px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #2874f0;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-btn:hover {
            opacity: 0.9;
        }

        .sort-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0 30px;
        }

        .sort-box label {
            font-weight: bold;
        }

        .sort-box select {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product-card h3 {
            margin: 15px 0 8px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #2874f0;
        }

        .rating {
            color: #f39c12;
            margin: 8px 0;
        }

        .marketplace {
            color: #666;
            margin-bottom: 15px;
        }

        .buy-btn,
        .cart-btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }

        .buy-btn {
            background: #2874f0;
            color: white;
        }

        .cart-btn {
            background: #ff9f00;
            color: white;
            border: none;
            margin-right: 8px;
        }

        .cart-btn:hover,
        .buy-btn:hover {
            opacity: 0.9;
        }

        /* CART */

        .cart-section {
            background: white;
            padding: 40px;
            margin-top: 20px;
        }

        .cart-container {
            max-width: 1000px;
            margin: auto;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            margin-bottom: 15px;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            margin: 0 0 8px;
        }

        .cart-price {
            color: #2874f0;
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity-controls button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 5px;
            background: #2874f0;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .remove-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-summary {
            text-align: right;
            border-top: 2px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
        }

        .cart-total {
            font-size: 26px;
            font-weight: bold;
            color: #2874f0;
            margin-bottom: 15px;
        }

        .clear-cart-btn {
            padding: 10px 18px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        #loading {
            color: #666;
        }

        #error {
            color: red;
        }

        @media (max-width: 700px) {

            header {
                padding: 20px;
                flex-direction: column;
            }

            .search-box input {
                width: 180px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
            }

            .cart-summary {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        SmartDeal
    </div>

    <div class="search-box">

        <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
        >

        <button onclick="searchProducts()">
            Search
        </button>

    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="#products">
            Products
        </a>

        <a href="#">
            Login
        </a>

        <a href="#cart">
            🛒 Cart (<span id="cartCount">0</span>)
        </a>

    </nav>

</header>


<section class="hero">

    <h1>
        Welcome to SmartDeal 🛍️
    </h1>

    <p>
        Best Deals. Best Products. Best Prices.
    </p>

    <a href="#products" class="btn">
        Shop Now
    </a>

</section>


<section class="products" id="products">

    <h2>
        Featured Products
    </h2>


    <!-- Category Filters -->

    <div class="filters">

        <button
                class="filter-btn"
                onclick="filterProducts('all')">
            All
        </button>

        <button
                class="filter-btn"
                onclick="filterProducts('Mobiles')">
            Mobiles
        </button>

        <button
                class="filter-btn"
                onclick="filterProducts('Headphones')">
            Headphones
        </button>

    </div>


    <!-- Price Sorting -->

    <div class="sort-box">

        <label for="sortSelect">
            Sort by:
        </label>

        <select
                id="sortSelect"
                onchange="sortProducts()">

            <option value="default">
                Default
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

        </select>

    </div>


    <p id="loading">
        Loading products...
    </p>

    <p id="error"></p>


    <div
            class="product-grid"
            id="productGrid">
    </div>

</section>


<!-- CART SECTION -->

<section class="cart-section" id="cart">

    <div class="cart-container">

        <h2>
            🛒 Your Cart
        </h2>

        <div id="cartItems"></div>

        <div class="cart-summary">

            <div class="cart-total">
                Total:
                ₹<span id="cartTotal">0</span>
            </div>

            <button
                    class="clear-cart-btn"
                    onclick="clearCart()">
                Clear Cart
            </button>

        </div>

    </div>

</section>


<script>

    let allProducts = [];

    let selectedCategory = "all";

    let cart =
        JSON.parse(
            localStorage.getItem("smartdealCart")
        ) || [];


    // ================= SEARCH =================

    function searchProducts() {

        applyFilters();

    }


    // ================= CATEGORY FILTER =================

    function filterProducts(category) {

        selectedCategory = category;

        applyFilters();

    }


    // ================= PRICE SORTING =================

    function sortProducts() {

        const sortValue =
            document
                .getElementById("sortSelect")
                .value;


        if (sortValue === "low") {

            allProducts.sort(
                (a, b) => a.price - b.price
            );

        }

        else if (sortValue === "high") {

            allProducts.sort(
                (a, b) => b.price - a.price
            );

        }


        applyFilters();

    }


    // ================= FILTER =================

    function applyFilters() {

        const searchText =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        const filteredProducts =
            allProducts.filter(product => {

                const matchesSearch =
                    product.name
                        .toLowerCase()
                        .includes(searchText);


                const matchesCategory =
                    selectedCategory === "all" ||
                    product.category === selectedCategory;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            });


        renderProducts(filteredProducts);

    }


    // ================= RENDER PRODUCTS =================

    function renderProducts(
        productsToRender = allProducts
    ) {

        const productGrid =
            document.getElementById("productGrid");


        productGrid.innerHTML = "";


        productsToRender.forEach(product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            card.dataset.category =
                product.category;


            card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <h3>
                    ${product.name}
                </h3>

                <div class="price">
                    ₹${Number(product.price).toLocaleString("en-IN")}
                </div>

                <div class="rating">
                    ⭐ ${product.rating}
                </div>

                <div class="marketplace">
                    Available on ${product.marketplace}
                </div>

                <button
                    class="cart-btn"
                    onclick="addToCart(${product.id})">
                    🛒 Add to Cart
                </button>

                <a
                    class="buy-btn"
                    href="${product.productUrl}"
                    target="_blank">
                    Buy Now
                </a>

            `;


            productGrid.appendChild(card);

        });

    }


    // ================= ADD TO CART =================

    function addToCart(productId) {

        const product =
            allProducts.find(
                p => p.id === productId
            );


        if (!product) {
            return;
        }


        const existingItem =
            cart.find(
                item => item.id === productId
            );


        if (existingItem) {

            existingItem.quantity++;

        } else {

            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image,
                quantity: 1
            });

        }


        saveCart();

        updateCart();


        alert(
            product.name +
            " added to cart!"
        );

    }


    // ================= SAVE CART =================

    function saveCart() {

        localStorage.setItem(
            "smartdealCart",
            JSON.stringify(cart)
        );

    }


    // ================= UPDATE CART =================

    function updateCart() {

        const cartCount =
            document.getElementById("cartCount");


        const cartItems =
            document.getElementById("cartItems");


        const cartTotal =
            document.getElementById("cartTotal");


        const totalQuantity =
            cart.reduce(
                (total, item) =>
                    total + item.quantity,
                0
            );


        cartCount.textContent =
            totalQuantity;


        cartItems.innerHTML = "";


        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty-cart">
                    Your cart is empty 🛒
                </div>
            `;

            cartTotal.textContent = "0";

            return;
        }


        let totalPrice = 0;


        cart.forEach(item => {

            totalPrice +=
                item.price * item.quantity;


            const cartItem =
                document.createElement("div");

            cartItem.className =
                "cart-item";


            cartItem.innerHTML = `

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="cart-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <div class="cart-price">
                        ₹${Number(item.price).toLocaleString("en-IN")}
                    </div>

                    <div class="quantity-controls">

                        <button
                            onclick="decreaseQuantity(${item.id})">
                            −
                        </button>

                        <strong>
                            ${item.quantity}
                        </strong>

                        <button
                            onclick="increaseQuantity(${item.id})">
                            +
                        </button>

                    </div>

                </div>

                <button
                    class="remove-btn"
                    onclick="removeFromCart(${item.id})">
                    Remove
                </button>

            `;


            cartItems.appendChild(cartItem);

        });


        cartTotal.textContent =
            Number(totalPrice)
                .toLocaleString("en-IN");

    }


    // ================= INCREASE =================

    function increaseQuantity(productId) {

        const item =
            cart.find(
                item => item.id === productId
            );


        if (item) {

            item.quantity++;

            saveCart();

            updateCart();

        }

    }


    // ================= DECREASE =================

    function decreaseQuantity(productId) {

        const item =
            cart.find(
                item => item.id === productId
            );


        if (!item) {
            return;
        }


        if (item.quantity > 1) {

            item.quantity--;

        } else {

            cart =
                cart.filter(
                    item => item.id !== productId
                );

        }


        saveCart();

        updateCart();

    }


    // ================= REMOVE =================

    function removeFromCart(productId) {

        cart =
            cart.filter(
                item => item.id !== productId
            );


        saveCart();

        updateCart();

    }


    // ================= CLEAR CART =================

    function clearCart() {

        if (cart.length === 0) {
            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to clear the cart?"
            );


        if (!confirmed) {
            return;
        }


        cart = [];


        saveCart();

        updateCart();

    }


    // ================= LOAD PRODUCTS =================

    fetch("/api/products")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load products"
                );

            }

            return response.json();

        })

        .then(products => {

            allProducts = products;


            document
                .getElementById("loading")
                .style.display = "none";


            renderProducts();

        })

        .catch(error => {

            document
                .getElementById("loading")
                .style.display = "none";


            document
                .getElementById("error")
                .textContent =
                "Products load nahi ho paaye.";


            console.error(error);

        });


    // ================= INITIAL CART =================

    updateCart();

</script>

</body>
</html>
