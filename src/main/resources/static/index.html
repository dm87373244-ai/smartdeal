<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDeal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .products {
            padding: 40px;
            text-align: center;
        }

        .products h2 {
            font-size: 30px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SmartDeal</div>

    <nav>
        <a href="/">Home</a>
        <a href="#">Products</a>
        <a href="#">Login</a>
        <a href="#">Cart</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to SmartDeal 🛍️</h1>
    <p>Best Deals. Best Products. Best Prices.</p>

    <a href="#" class="btn">Shop Now</a>
</section>

<section class="products">
    <h2>Featured Products</h2>
    <p>Products will appear here soon...</p>
</section>

</body>
</html>
